services:
  - type: web
    name: stock-take-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: stock-take-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: stock-take-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: stock-take-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: stock-take-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: stock-take-db
          property: password
      - key: ADMIN_API_KEY
        sync: false

databases:
  - name: stock-take-db
    plan: free