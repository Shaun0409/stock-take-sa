name: stock_take_mobile
description: Mobile app for stock taking in convenience stores
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  cupertino_icons: ^1.0.6
  provider: ^6.0.5
  
  # Database - sqflite works on mobile, not web
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0  # For web testing
  path_provider: ^2.1.0
  path: ^1.8.3
  
  # Networking
  dio: ^5.9.2
  connectivity_plus: ^5.0.1
  
  # Utilities
  intl: ^0.18.1
  shared_preferences: ^2.5.5
  mobile_scanner: ^7.2.0
  image_picker: ^1.2.2
  pdf: ^3.12.0
  printing: ^5.14.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/